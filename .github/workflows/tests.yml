# Runs the test suite on every pull request and on main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B -m unittest discover -s tests -t .

  # Tests the package as pipx and Homebrew install it. The source-tree tests skip there.
  installed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: wheel
            file: "*.whl"
          - package: sdist
            file: "*.tar.gz"
    name: installed (${{ matrix.package }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv "$RUNNER_TEMP/venv"
      - run: $RUNNER_TEMP/venv/bin/pip install dist/${{ matrix.file }}
      - run: mkdir -p "$RUNNER_TEMP/suite"
      - run: cp -R tests "$RUNNER_TEMP/suite/tests"
      - name: fav comes from the virtualenv
        working-directory: ${{ runner.temp }}/suite
        run: $RUNNER_TEMP/venv/bin/python -c 'import fav, sys; assert fav.__file__.startswith(sys.prefix), fav.__file__'
      - working-directory: ${{ runner.temp }}/suite
        run: $RUNNER_TEMP/venv/bin/python -B -m unittest discover -s tests -t .
      - run: $RUNNER_TEMP/venv/bin/fav --version
